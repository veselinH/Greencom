spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: 'false'
  mvc:
    hiddenmethod:
      filter:
        enabled: 'true'
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:greencom_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
          facebook:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - public_profile
          github:
            client-id: test-client-id
            client-secret: test-client-secret
loyalty:
  service:
    url: http://localhost:9561
greencom:
  admin:
    username: admin
    password: admin
